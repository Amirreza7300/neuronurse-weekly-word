name: collect-weekly-word
on:
  schedule:
    # هر ۳ ساعت یک بار (UTC). وقتی کانال به‌روز است هر اجرا ۱ تا ۲ دقیقه
    # طول می‌کشد؛ در بایگانی اولیه هر اجرا تا ۱۰۰۰ پست می‌گیرد و
    # طولانی‌تر است، ولی ریپوی عمومی Actions نامحدود و رایگان دارد.
    - cron: "17 */3 * * *"
    # بستن هفته و ارسال ورد هفته: پنجشنبه شب ساعت ۱۲ (۰۰:۰۰ جمعه) تهران
    # = پنجشنبه ۲۰:۳۰ UTC (هفته از جمعه ۰۰:۰۰ شروع می‌شود)
    - cron: "30 20 * * 4"
  workflow_dispatch:
    inputs:
      recheck_missing:
        description: "دوباره‌چک آیتم‌های بدون توضیح (عدد = سقف آیتم؛ خالی = جمع‌کردن عادی)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# دو اجرا هم‌زمان روی یک state کار نکنند؛ اجرای در حال انجام
# لغو نمی‌شود تا بایگانی اولیه نصفه نماند.
concurrency:
  group: collect-weekly-word
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # سقف ۲۰ دقیقه برای بایگانی اولیه کل کانال کم بود (اجرای تستی
    # ۲۶ آبان در ۲۰ دقیقه کنسل شد و هیچ stateای ذخیره نشد). با
    # --limit هر اجرا حداکثر ۱۰۰۰ پست می‌گیرد و تمام می‌شود؛
    # سقف ۱۲۰ دقیقه فقط حاشیه امن برای FloodWait و کندی تلگرام است.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect + build Word
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          if [ -n "${{ inputs.recheck_missing }}" ]; then
            python collector.py --recheck-missing ${{ inputs.recheck_missing }} --build
          else
            python collector.py --collect --build --limit 1000
          fi
      - name: Commit state + Word files
        if: always()
        run: |
          git config user.name "neuronurse-bot"
          git config user.email "bot@local"
          git add data/state.json out/ || true
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F_%H%M)"
          git push || true
      - name: Send latest weekly Word + JSON to owner (Thursday-night run only)
        if: github.event.schedule == '30 20 * * 4'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_CHAT_ID" ]; then
            send_one() {
              [ -f "$1" ] && curl -s -F chat_id="$OWNER_CHAT_ID" -F document=@"$1" \
                -F caption="$2" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" > /dev/null
            }
            q=$(ls -t out/weekly/Quiz-*.docx 2>/dev/null | head -1)
            v=$(ls -t out/weekly/Visual-*.docx 2>/dev/null | head -1)
            send_one "$q" "ورد تست‌های هفته"
            send_one "${q%.docx}.json" "JSON تست‌های هفته، برای اپلیکیشن"
            send_one "$v" "ورد حافظه و پمفلت هفته"
            send_one "${v%.docx}.json" "JSON حافظه و پمفلت هفته، برای اپلیکیشن"
          fi
