name: collect-weekly-word
on:
  schedule:
    # هر ۳ ساعت یک بار (UTC) — حدود ۲۴۰ اجرا در ماه، هر اجرا ۱ تا ۲ دقیقه
    # یعنی حدود ۴۰۰ تا ۵۰۰ دقیقه در ماه؛ زیر سقف رایگان ۲۰۰۰ دقیقه
    # ریپوی خصوصی است. ریپوی عمومی: Actions نامحدود و رایگان است.
    - cron: "17 */3 * * *"
    # بستن هفته و ارسال ورد هفته: پنجشنبه شب ساعت ۲۳:۳۰ تهران
    # = پنجشنبه ۲۰:۰۰ UTC (هفته از جمعه ۰۰:۰۰ شروع می‌شود)
    - cron: "0 20 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect + build Word
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python collector.py --collect --build
      - name: Commit state + Word files
        run: |
          git config user.name "neuronurse-bot"
          git config user.email "bot@local"
          git add data/state.json out/ || true
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F_%H%M)"
          git push || true
      - name: Send latest weekly Word + JSON to owner (Thursday-night run only)
        if: github.event.schedule == '0 20 * * 4'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$OWNER_CHAT_ID" ]; then
            send_one() {
              [ -f "$1" ] && curl -s -F chat_id="$OWNER_CHAT_ID" -F document=@"$1" \
                -F caption="$2" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" > /dev/null
            }
            q=$(ls -t out/weekly/Quiz-*.docx 2>/dev/null | head -1)
            v=$(ls -t out/weekly/Visual-*.docx 2>/dev/null | head -1)
            send_one "$q" "ورد تست‌های هفته"
            send_one "${q%.docx}.json" "JSON تست‌های هفته، برای اپلیکیشن"
            send_one "$v" "ورد حافظه و پمفلت هفته"
            send_one "${v%.docx}.json" "JSON حافظه و پمفلت هفته، برای اپلیکیشن"
          fi
