# -*- coding: utf-8 -*-
# تنظیمات استخراج هفتگی نورونرس — فقط همین فایل را ویرایش کن.
# لینک/آیدی کانال‌ها را اینجا بگذار. می‌تواند یوزرنیم (@name)، لینک t.me
# یا آیدی عددی کانال باشد. اگر کانال تست و کانال تصویری یکی است، هر دو
# را همان یکی بگذار؛ تفکیک بر اساس نوع پست انجام می‌شود (کوییز / هشتگ).

timezone: "Asia/Tehran"

# هفته از جمعه ساعت ۰۰:۰۰ تهران شروع می‌شود تا جمعه بعد ساعت ۰۰:۰۰.
week_start_weekday: "Friday"
week_start_hour: 0

# ارسال و به‌روزرسانی ورد هفته: پنجشنبه شب ساعت ۲۳:۳۰ تهران
# (در ورک‌فلو: پنجشنبه ۲۰:۰۰ UTC). جمع‌کردن پست‌های جدید در طول
# هفته هر ۳ ساعت ادامه دارد؛ فقط فایل هفته پنجشنبه شب بسته و فرستاده می‌شود.
weekly_send_weekday: "Thursday"
weekly_send_time_tehran: "23:30"

# چند ساعت بعد از انتشار، یک پست دوباره چک شود (جواب ادمین ممکن است
# دیرتر بیاید). بعد از این مدت، پست نهایی می‌شود.
recheck_hours: 48
# پست‌هایی که توضیح ندارند تا چند روز دوباره چک شوند.
recheck_missing_days: 7

# رای‌دادن به کوییز برای مشخص‌شدن جواب صحیح: true
# امیررضا 2026-11-17 گفت خودش رای بدهد تا جواب مشخص شود؛ نتیجه
# نظرسنجی برایش مهم نیست (با اکانت دیگر داردش). اگر false شود،
# جواب تست‌های باز «نامشخص» می‌ماند تا نظرسنجی بسته شود.
allow_vote: true

# حداکثر پیام متوالی ادمین برای هر تست (قانون خودت: تا ۷ پیام)
max_admin_messages: 7
# بین پست‌ها مکث (ثانیه) برای اینکه تلگرام محدود نکند
pause_between_posts: 0.4

sources:
  - id: quiz
    kind: quiz
    channel: "https://t.me/Neuro_Nurse"
    label: "تست‌های کوییز"
  - id: visual
    kind: visual
    # کانال جدا برای پمفلت و حافظه تصویری هنوز ساخته نشده؛
    # وقتی تکمیل شد و لینکش آمد، اینجا جایگزین شود.
    channel: "@CHANGEME_VISUAL_CHANNEL"
    label: "حافظه تصویری و پمفلت"
    # هشتگ‌ها به همین ترتیب در ورد گروه‌بندی می‌شوند؛ هر گروه پشت سر هم.
    hashtags:
      - "#حافظه_تصویری"
      - "#پمفلت_تصویری"
      - "#پمفلت"
    # اگر پستی هیچ‌کدام از این هشتگ‌ها را نداشت، نادیده گرفته می‌شود.
    # برای اینکه همه پست‌های غیرکوییز کانال بیایند، require_hashtag را false کن.
    require_hashtag: true

# سوال‌هایی که پیام بالای کوییز هم جزو صورت سوال است (فقط همین‌ها).
# قانون قبلی خودت؛ خالی بگذار یعنی هیچ‌کدام.
preceding_stem_numbers: []

# فونت ورد
font_name: "Vazirmatn"
font_size: 13
title_font_size: 16
